name: Docker

on:
    push:
        branches:
            - main

env:
    REGISTRY: ghcr.io

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: yarn

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build production
              run: yarn workspace workswap-production build

            - name: Build admin
              run: yarn workspace workswap-admin build

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push production
              uses: docker/build-push-action@v6
              with:
                  context: ./packages/production
                  file: ./packages/production/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/workswap-production:latest
                      ghcr.io/${{ github.repository_owner }}/workswap-production:${{ github.sha }}

            - name: Build and push admin
              uses: docker/build-push-action@v6
              with:
                  context: ./packages/admin
                  file: ./packages/admin/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/workswap-admin:latest
                      ghcr.io/${{ github.repository_owner }}/workswap-admin:${{ github.sha }}